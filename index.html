<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Danish municipal election projection</title>
</head>
<body>
  <h1>Danish municipal election projection</h1>

  <!-- Add IDs so we can replace these via JS -->
  <p id="intro-1">
    This projection is based on the results published by
    <a href="https://valg.dk/" target="_blank">valg.dk</a>.
  </p>
  <p id="intro-2">
    The projection is based on the results in polling areas that have already reported...
  </p>
  <p id="intro-3">
    Important note: The projected vote shares will only represent the entire electorate...
  </p>

  <div id="results-summary"></div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.1/papaparse.min.js"></script>
  <script>
    const translations = {
      en: {
        htmlTitle: "Danish municipal election projection",
        mainHeading: "Danish municipal election projection",

        intro1Html:
          'This projection is based on the results published by <a href="https://valg.dk/" target="_blank">valg.dk</a>.',
        intro2Html:
          "The projection is based on the results in polling areas that have already reported. The remaining polling area results are projected based on the trends observed in those that have reported. As with all projections, the numbers should be taken with a grain of salt. The projection will initially be quite uncertain but will become more accurate as more of the votes are counted. If no results have been reported in a municipality, no projection is made.",
        intro3Html:
          "Important note: The projected vote shares will only represent the entire electorate once all 98 municipalities have at least one reported polling area.",

        stats: {
          countedLabelHtmlPrefix: "<strong>Counted:</strong> ",
          turnoutLabelHtmlPrefix: "<strong>Turnout:</strong> ",
          invalidLabelHtmlPrefix: "<strong>Invalid votes:</strong> ",
        },

        dropdown: {
          labelHtml: "<strong>Go to municipality:</strong>&nbsp;",
          placeholderOption: "Select...",
        },

        nationalTable: {
          headerFullyCounted: ["Party", "Votes", "%", "Seats"],
          headerProjected: [
            "Party",
            "Current Votes",
            "Current %",
            "Current Seats",
            "Projected Votes",
            "Projected %",
            "Projected Seats",
          ],
          otherPartiesLabel: "Other parties",
          totalLabel: "TOTAL",
        },

        muniBlocks: {
          countedLabelHtmlPrefix: "<strong>Counted:</strong> ",
          noPrecincts: (name) => `No precincts in ${name} have reported.`,
          headerFullyCounted: ["Party", "Votes", "%", "Quotients", "Seats"],
          headerProjected: [
            "Party",
            "Current Votes",
            "Current %",
            "Current Quotients",
            "Current Seats",
            "Projected Votes",
            "Projected %",
            "Projected Quotients",
            "Projected Seats",
          ],
          totalLabel: "TOTAL",
        },

        summaries: {
          muniReported: (reported, total) =>
            `${reported} out of ${total} municipalities have at least one reported polling area.`,
          precinctsReported: (reportedStr, totalStr, pct) =>
            `${reportedStr} out of ${totalStr} (${pct}%) polling areas have reported.`,
          lastUpdated: (formattedDate) => `Last updated: ${formattedDate}`,
        },
      },

      da: {
        htmlTitle: "Kommunalvalgsprognose",
        mainHeading: "Kommunalvalgsprognose",

        intro1Html:
          'Denne prognose er baseret på valgresultaterne fra <a href="https://valg.dk/" target="_blank">valg.dk</a>.',
        intro2Html:
          "Prognosen er baseret på resultater fra de afstemningsområder, der allerede har reporteret et resultat. De øvrige afstemningsområderesultater forudsiges baseret på de tendenser, der udspiller sig i de reporterede resultater. Ligesom med alle andre prognoser, må tallene tages med et gran salt. Prognosen vil indledningsvist være ret usikker, men bliver mere præcis efterhånden som flere af stemmerne bliver talt. Hvis der ikke er nogen resultater i en kommune, foretages der ingen prognose.",
        intro3Html:
          "Bemærk: Prognosens stemmeandele repræsenterer først hele landets vælgere når alle 98 kommuner har mindst ét afstemningsområde med et resultat.",

        stats: {
          countedLabelHtmlPrefix: "<strong>Optalt:</strong> ",
          turnoutLabelHtmlPrefix: "<strong>Valgdeltagelse:</strong> ",
          invalidLabelHtmlPrefix: "<strong>Ugyldige stemmer:</strong> ",
        },

        dropdown: {
          labelHtml: "<strong>Gå til kommune:</strong>&nbsp;",
          placeholderOption: "Vælg...",
        },

        nationalTable: {
          headerFullyCounted: [
            "Parti",
            "Stemmer",
            "%",
            "Mandater",
          ],
          headerProjected: [
            "Parti",
            "Nuværende Stemmer",
            "Nuværende %",
            "Nuværende Mandater",
            "Prognose Stemmer",
            "Prognose %",
            "Prognose Mandater",
          ],
          otherPartiesLabel: "Øvrige Partier",
          totalLabel: "TOTAL",
        },

        muniBlocks: {
          countedLabelHtmlPrefix: "<strong>Optalt:</strong> ",
          noPrecincts: (name) => `Ingen afstemningsområder i ${name} er optalt.`,
          headerFullyCounted: [
            "Parti",
            "Stemmer",
            "%",
			      "Kvotienter",
            "Mandater",
          ],
          headerProjected: [
            "Parti",
            "Nuværende Stemmer",
            "Nuværende %",
			      "Nuværende Kvotienter",
            "Nuværende Mandater",
            "Prognose Stemmer",
            "Prognose %",
			      "Prognose Kvotienter",
            "Prognose Mandater",
          ],
          totalLabel: "TOTAL",
        },

        summaries: {
          muniReported: (reported, total) =>
            `${reported} ud af ${total} kommuner har mindst ét optalt afstemningsområde.`,
          precinctsReported: (reportedStr, totalStr, pct) =>
            `${reportedStr} ud af ${totalStr} (${pct}%) afstemningsområder er optalt.`,
          lastUpdated: (formattedDate) =>
            `Sidst opdateret: ${formattedDate}`,
        },
      },
    };

    const userLang =
      (navigator.language || navigator.userLanguage || "en").toLowerCase();
    const lang = userLang.startsWith("da") ? "da" : "en";
    const t = translations[lang];

    document.title = t.htmlTitle;

    const mainH1 = document.querySelector("h1");
    if (mainH1) mainH1.textContent = t.mainHeading;

    const intro1 = document.getElementById("intro-1");
    const intro2 = document.getElementById("intro-2");
    const intro3 = document.getElementById("intro-3");
    if (intro1) intro1.innerHTML = t.intro1Html;
    if (intro2) intro2.innerHTML = t.intro2Html;
    if (intro3) intro3.innerHTML = t.intro3Html;


    fetch("Result data.json")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("results-summary");

        // Turnout
        const projectedTotalVotes = data.national.projected.total_votes;
        const projectedElectorate = data.national.projected.electorate;
        const turnoutPct = projectedElectorate
          ? (projectedTotalVotes / projectedElectorate * 100).toFixed(1)
          : "0.0";

        // Invalid
        const projectedValid = data.national.projected.valid_votes;
        const projectedInvalid = data.national.projected.invalid_votes;
        const invalidPct = projectedTotalVotes
          ? (projectedInvalid / projectedTotalVotes * 100).toFixed(1)
          : "0.0";

        // Stats and dropdown
        const topFlex = document.createElement("div");
        topFlex.style.display = "flex";
        topFlex.style.alignItems = "left";
        topFlex.style.justifyContent = "flex-start";
        topFlex.style.flexWrap = "wrap";
        topFlex.style.columnGap = "100px";
        topFlex.style.marginBottom = "1em";

        // Stats
        const statBlock = document.createElement("div");

        const counted = document.createElement("p");
        counted.innerHTML =
          `${t.stats.countedLabelHtmlPrefix}${data.national.percent_reported.toFixed(1)}%`;
        counted.style.fontSize = "20px";

        const turnout = document.createElement("p");
        turnout.innerHTML =
          `${t.stats.turnoutLabelHtmlPrefix}${turnoutPct}%`;
        turnout.style.fontSize = "20px";

        const invalid = document.createElement("p");
        invalid.innerHTML =
          `${t.stats.invalidLabelHtmlPrefix}${invalidPct}%`;
        invalid.style.fontSize = "20px";

        statBlock.appendChild(counted);
        statBlock.appendChild(turnout);
        statBlock.appendChild(invalid);

        // Dropdown
        const dropdownBlock = document.createElement("div");
        dropdownBlock.style.display = "flex";
        dropdownBlock.style.alignItems = "center";
        dropdownBlock.style.gap = "8px";

        const label = document.createElement("label");
        label.htmlFor = "muni-select";
        label.innerHTML = t.dropdown.labelHtml;
        label.style.fontSize = "20px";

        const select = document.createElement("select");
        select.id = "muni-select";
        select.style.fontSize = "20px";
        select.innerHTML = `<option value="">${t.dropdown.placeholderOption}</option>`;

        Object.keys(data.municipalities)
          .sort((a, b) => a.localeCompare(b, 'da'))
          .forEach(name => {
            const option = document.createElement("option");
            option.value = `./Municipality/${name}`;
            option.textContent = name;
            select.appendChild(option);
          });

        select.addEventListener("change", function () {
          if (this.value) window.location.href = this.value;
        });

        dropdownBlock.appendChild(label);
        dropdownBlock.appendChild(select);

        topFlex.appendChild(statBlock);
        topFlex.appendChild(dropdownBlock);
        container.appendChild(topFlex);

        // Results table
        const table = document.createElement("table");
        table.style.borderCollapse = "collapse";
        table.style.marginBottom = "1em";
        table.style.border = "1px solid black";

        const nationalIsFullyCounted = data.national.percent_reported === 100;
        table.style.maxWidth = nationalIsFullyCounted ? "800px" : "1200px";

        const header = document.createElement("tr");
        const nationalHeaderLabels = nationalIsFullyCounted
          ? t.nationalTable.headerFullyCounted
          : t.nationalTable.headerProjected;

        nationalHeaderLabels.forEach((h, i) => {
          const th = document.createElement("th");
          th.textContent = h;
          th.style.padding = "6px 12px";
          th.style.fontSize = "18px";
          th.style.border = "1px solid black";
          th.style.textAlign = i === 0 ? "left" : "center";
          if (i === 0) {
            th.style.backgroundColor = "#F2F2F2";
            th.style.color = "black";
            th.style.width = "320px";
          }
          header.appendChild(th);
        });
        table.appendChild(header);

        const projected = data.national.projected;
        const current = data.national.current;

        data.relevant_parties.forEach(party => {
          const row = document.createElement("tr");

          const currVotes = current.votes[party] || 0;
          const currPct = current.percentages[party] || 0;
          const currSeats = current.seats[party] || 0;
          const projVotes = projected.votes[party] || 0;
          const projPct = projected.percentages[party] || 0;
          const projSeats = projected.seats[party] || 0;

          [
            party,
            currVotes.toLocaleString(),
            `${currPct.toFixed(2)}%`,
            currSeats,
            projVotes.toLocaleString(),
            `${projPct.toFixed(2)}%`,
            projSeats,
          ].forEach((val, i) => {
            const td = document.createElement("td");
            td.textContent = val;
            td.style.padding = "6px 12px";
            td.style.border = "1px solid black";
            td.style.textAlign = i === 0 ? "left" : "center";

            if (i === 0) {
              td.style.fontWeight = "bold";
              if (party === "A. Socialdemokratiet") {
                td.style.backgroundColor = "#f04d46";
                td.style.color = "white";
              } else if (party === "B. Radikale Venstre") {
                td.style.backgroundColor = "#733280";
                td.style.color = "white";
              } else if (party === "C. Det Konservative Folkeparti") {
                td.style.backgroundColor = "#004931";
                td.style.color = "white";
              } else if (party === "D. Nye Borgerlige") {
                td.style.backgroundColor = "#127B7f";
                td.style.color = "white";
              } else if (party === "F. SF - Socialistisk Folkeparti") {
                td.style.backgroundColor = "#e07ea8";
                td.style.color = "white";
              } else if (party === "I. Liberal Alliance") {
                td.style.backgroundColor = "#3fb2be";
                td.style.color = "white";
              } else if (party === "K. KD – Kristendemokraterne") {
                td.style.backgroundColor = "#b1a269";
                td.style.color = "black";
              } else if (party === "M. Moderaterne") {
                td.style.backgroundColor = "#b385e0";
                td.style.color = "white";
              } else if (party === "O. Dansk Folkeparti") {
                td.style.backgroundColor = "#fcd03b";
                td.style.color = "black";
              } else if (party === "Q. Frie Grønne - Danmarks nye venstrefløjsparti") {
                td.style.backgroundColor = "#5abe82";
                td.style.color = "black";
              } else if (party === "V. Venstre, Danmarks Liberale Parti") {
                td.style.backgroundColor = "#002883";
                td.style.color = "white";
              } else if (party === "Æ. Danmarksdemokraterne - Inger Støjberg") {
                td.style.backgroundColor = "#479ee5";
                td.style.color = "white";
              } else if (party === "Ø. Enhedslisten - De Rød-Grønne") {
                td.style.backgroundColor = "#e6801a";
                td.style.color = "white";
              } else if (party === "Å. Alternativet") {
                td.style.backgroundColor = "#00ff00";
                td.style.color = "black";
              } else {
                td.style.backgroundColor = "#c0c0c0";
                td.style.color = "black";
              }
            }

            row.appendChild(td);
          });

          table.appendChild(row);
        });

        // Other parties
        const otherRow = document.createElement("tr");

        const totalCurrentValid = current.valid_votes;
        const totalProjectedValid = projected.valid_votes;

        let knownCurrentVotes = 0;
        let knownProjectedVotes = 0;

        data.relevant_parties.forEach(party => {
          knownCurrentVotes += current.votes[party] || 0;
          knownProjectedVotes += projected.votes[party] || 0;
        });

        const otherCurrentVotes = totalCurrentValid - knownCurrentVotes;
        const otherProjectedVotes = totalProjectedValid - knownProjectedVotes;

        const otherCurrentPct = totalCurrentValid
          ? (otherCurrentVotes / totalCurrentValid * 100)
          : 0;
        const otherProjectedPct = totalProjectedValid
          ? (otherProjectedVotes / totalProjectedValid * 100)
          : 0;

        const otherRowData = nationalIsFullyCounted
          ? [
              t.nationalTable.otherPartiesLabel,
              otherProjectedVotes.toLocaleString(),
              `${otherProjectedPct.toFixed(2)}%`,
              0,
            ]
          : [
              t.nationalTable.otherPartiesLabel,
              otherCurrentVotes.toLocaleString(),
              `${otherCurrentPct.toFixed(2)}%`,
              0,
              otherProjectedVotes.toLocaleString(),
              `${otherProjectedPct.toFixed(2)}%`,
              0,
            ];

        otherRowData.forEach((val, i) => {
          const td = document.createElement("td");
          td.textContent = val;
          td.style.padding = "6px 12px";
          td.style.border = "1px solid black";
          td.style.textAlign = i === 0 ? "left" : "center";

          if (i === 0) {
            td.style.fontWeight = "bold";
            td.style.backgroundColor = "#808080";
            td.style.color = "white";
          }

          otherRow.appendChild(td);
        });

        table.appendChild(otherRow);

        // Total row
        const totalRow = document.createElement("tr");

        let totalCurrentVotes = 0;
        let totalProjectedVotes = 0;
        let totalCurrentSeats = 0;
        let totalProjectedSeats = 0;

        data.relevant_parties.forEach(party => {
          totalCurrentVotes += current.votes[party] || 0;
          totalProjectedVotes += projected.votes[party] || 0;
          totalCurrentSeats += current.seats[party] || 0;
          totalProjectedSeats += projected.seats[party] || 0;
        });

        totalCurrentVotes += otherCurrentVotes;
        totalProjectedVotes += otherProjectedVotes;

        const totalRowData = nationalIsFullyCounted
          ? [
              t.nationalTable.totalLabel,
              totalProjectedVotes.toLocaleString(),
              "100.00%",
              totalProjectedSeats,
            ]
          : [
              t.nationalTable.totalLabel,
              totalCurrentVotes.toLocaleString(),
              "100.00%",
              totalCurrentSeats,
              totalProjectedVotes.toLocaleString(),
              "100.00%",
              totalProjectedSeats,
            ];

        totalRowData.forEach((val, i) => {
          const td = document.createElement("td");
          td.textContent = val;
          td.style.padding = "6px 12px";
          td.style.border = "1px solid black";
          td.style.textAlign = i === 0 ? "left" : "center";
          if (i === 0) {
            td.style.fontWeight = "bold";
            td.style.backgroundColor = "#F2F2F2";
            td.style.color = "black";
          }
          totalRow.appendChild(td);
        });

        table.appendChild(totalRow);

        container.appendChild(table);

        // Division summary
        const munReported = data.national.municipalities_with_results;
        const munTotal = data.national.total_municipalities;
        const p = document.createElement("p");
        p.textContent = t.summaries.muniReported(munReported, munTotal);
        container.appendChild(p);

        // Precinct summary
        const precinctPct = (
          data.national.precincts_reported / data.national.total_precincts * 100
        ).toFixed(1);
        const precinctP = document.createElement("p");
        const reportedStr = data.national.precincts_reported.toLocaleString("en-GB");
        const totalStr = data.national.total_precincts.toLocaleString("en-GB");
        precinctP.textContent = t.summaries.precinctsReported(
          reportedStr,
          totalStr,
          precinctPct
        );
        container.appendChild(precinctP);

        // Last updated
        const updatedDate = new Date(data.timestamp);
        const formattedDate = updatedDate.toLocaleString("en-GB", {
          timeZone: "Europe/Copenhagen",
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZoneName: 'short',
        });
        const lastUpdatedP = document.createElement("p");
        lastUpdatedP.textContent = t.summaries.lastUpdated(formattedDate);
        lastUpdatedP.style.fontSize = "16px";
        lastUpdatedP.style.color = "gray";
        container.appendChild(lastUpdatedP);

        const municipalities = data.municipalities;

        for (const [name, details] of Object.entries(municipalities)) {
          const block = document.createElement("div");
          block.style.marginBottom = "2em";

          // Header
          const headerLink = document.createElement("h2");
          headerLink.style.fontSize = "18px";
          const link = document.createElement("a");
          link.href = encodeURI(`./Municipality/${name}`);
          link.textContent = name;
          link.style.color = "blue";
          link.style.textDecoration = "underline";
          headerLink.appendChild(link);
          block.appendChild(headerLink);

          // Percent reported
          if (details.precincts_reported === 0) {
            const msg = document.createElement("p");
            msg.textContent = t.muniBlocks.noPrecincts(name);
            msg.style.fontSize = "16px";
            block.appendChild(msg);
            container.appendChild(block);
            continue;
          } else {
            const percentReported = document.createElement("p");
            percentReported.innerHTML =
              `${t.muniBlocks.countedLabelHtmlPrefix}${details.percent_reported.toFixed(1)}%`;
            const isFullyCounted = details.percent_reported === 100;

            percentReported.style.fontSize = "16px";
            block.appendChild(percentReported);

            // Results table for each municipality
            const muntable = document.createElement("table");
            muntable.style.borderCollapse = "collapse";
            muntable.style.width = "100%";
            muntable.style.border = "1px solid black";

            if (isFullyCounted) {
              muntable.style.maxWidth = "500px";
            } else {
              muntable.style.maxWidth = "800px";
            }

            const munheader = document.createElement("tr");
            const headerLabels = isFullyCounted
              ? t.muniBlocks.headerFullyCounted
              : t.muniBlocks.headerProjected;

            headerLabels.forEach((label, i) => {
              const th = document.createElement("th");
              th.textContent = label;
              th.style.padding = "4px";
              th.style.fontSize = "14px";
              th.style.border = "1px solid black";
              th.style.textAlign = i === 0 ? "left" : "center";
              if (i === 0) {
                th.style.backgroundColor = "#F2F2F2";
                th.style.color = "black";
                th.style.textAlign = "left";
                if (isFullyCounted) {
                  th.style.width = "140px";
                } else {
                  th.style.width = "200px";
                }
              }
              munheader.appendChild(th);
            });
            muntable.appendChild(munheader);

            const current = details.current;
            const projected = details.projected;

            const allParties = details.projected_vote_order;

            allParties.forEach(party => {
              const row = document.createElement("tr");

              const currVotes = current.votes[party] || 0;
              const currPct = current.percentages[party] || 0;
              const currQuo = current.quotients[party] || 0;
              const currSeats = current.seats[party] || 0;

              const projVotes = projected.votes[party] || 0;
              const projPct = projected.percentages[party] || 0;
              const projQuo = projected.quotients[party] || 0;
              const projSeats = projected.seats[party] || 0;

              const rowData = isFullyCounted
                ? [
                    party,
                    projVotes.toLocaleString(),
                    `${projPct.toFixed(2)}%`,
                    projQuo.toFixed(2),
                    projSeats,
                  ]
                : [
                    party,
                    currVotes.toLocaleString(),
                    `${currPct.toFixed(2)}%`,
                    currQuo.toFixed(2),
                    currSeats,
                    projVotes.toLocaleString(),
                    `${projPct.toFixed(2)}%`,
                    projQuo.toFixed(2),
                    projSeats,
                  ];

              rowData.forEach((val, i) => {
                const td = document.createElement("td");
                td.textContent = val;
                td.style.padding = "4px";
                td.style.fontSize = "14px";
                td.style.border = "1px solid black";
                td.style.textAlign = i === 0 ? "left" : "center";
                if (i === 0) {
                  td.style.fontWeight = "bold";
                  td.style.textAlign = "left";
                  td.style.whiteSpace = "nowrap";
                  if (isFullyCounted) {
                    td.style.width = "140px";
                  } else {
                    td.style.width = "200px";
                  }
                  // Background colors
                  if (party === "A. Socialdemokratiet") {
                    td.style.backgroundColor = "#f04d46";
                    td.style.color = "white";
                  } else if (party === "B. Radikale Venstre") {
                    td.style.backgroundColor = "#733280";
                    td.style.color = "white";
                  } else if (party === "C. Det Konservative Folkeparti") {
                    td.style.backgroundColor = "#004931";
                    td.style.color = "white";
                  } else if (party === "D. Nye Borgerlige") {
                    td.style.backgroundColor = "#127B7f";
                    td.style.color = "white";
                  } else if (party === "F. SF - Socialistisk Folkeparti") {
                    td.style.backgroundColor = "#e07ea8";
                    td.style.color = "white";
                  } else if (party === "I. Liberal Alliance") {
                    td.style.backgroundColor = "#3fb2be";
                    td.style.color = "white";
                  } else if (party === "K. KD – Kristendemokraterne") {
                    td.style.backgroundColor = "#b1a269";
                    td.style.color = "black";
                  } else if (party === "M. Moderaterne") {
                    td.style.backgroundColor = "#b385e0";
                    td.style.color = "white";
                  } else if (party === "O. Dansk Folkeparti") {
                    td.style.backgroundColor = "#fcd03b";
                    td.style.color = "black";
                  } else if (party === "Q. Frie Grønne - Danmarks nye venstrefløjsparti") {
                    td.style.backgroundColor = "#5abe82";
                    td.style.color = "black";
                  } else if (party === "V. Venstre, Danmarks Liberale Parti") {
                    td.style.backgroundColor = "#002883";
                    td.style.color = "white";
                  } else if (party === "Æ. Danmarksdemokraterne - Inger Støjberg") {
                    td.style.backgroundColor = "#479ee5";
                    td.style.color = "white";
                  } else if (party === "Ø. Enhedslisten - De Rød-Grønne") {
                    td.style.backgroundColor = "#e6801a";
                    td.style.color = "white";
                  } else if (party === "Å. Alternativet") {
                    td.style.backgroundColor = "#00ff00";
                    td.style.color = "black";
                  } else if (party === "S. Slesvigsk Parti") {
                    td.style.backgroundColor = "#e8ae00";
                    td.style.color = "black";
                  } else {
                    td.style.backgroundColor = "#808080";
                    td.style.color = "white";
                  }
                }
                row.appendChild(td);
              });

              muntable.appendChild(row);
            });

            // TOTAL row
            const totalRow = document.createElement("tr");

            let totalCurrVotes = 0;
            let totalProjVotes = 0;
            let totalCurrQuo = 0;
            let totalProjQuo = 0;
            let totalCurrSeats = 0;
            let totalProjSeats = 0;

            allParties.forEach(party => {
              totalCurrVotes += current.votes[party] || 0;
              totalCurrQuo += current.quotients[party] || 0;
              totalCurrSeats += current.seats[party] || 0;
              totalProjVotes += projected.votes[party] || 0;
              totalProjQuo += projected.quotients[party] || 0;
              totalProjSeats += projected.seats[party] || 0;
            });

            const totalRowData = isFullyCounted
              ? [
                  t.muniBlocks.totalLabel,
                  totalProjVotes.toLocaleString(),
                  "100.00%",
                  totalProjQuo.toFixed(2),
                  totalProjSeats,
                ]
              : [
                  t.muniBlocks.totalLabel,
                  totalCurrVotes.toLocaleString(),
                  "100.00%",
                  totalCurrQuo.toFixed(2),
                  totalCurrSeats,
                  totalProjVotes.toLocaleString(),
                  "100.00%",
                  totalProjQuo.toFixed(2),
                  totalProjSeats,
                ];

            totalRowData.forEach((val, i) => {
              const td = document.createElement("td");
              td.textContent = val;
              td.style.padding = "4px";
              td.style.fontSize = "14px";
              td.style.border = "1px solid black";
              td.style.textAlign = i === 0 ? "left" : "center";
              if (i === 0) {
                td.style.fontWeight = "bold";
                td.style.backgroundColor = "#F2F2F2";
                td.style.color = "black";
              }
              totalRow.appendChild(td);
            });

            muntable.appendChild(totalRow);
            block.appendChild(muntable);
            container.appendChild(block);
          }
        }
      });
  </script>
</body>
</html>
